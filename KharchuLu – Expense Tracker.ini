KharchuLu – Expense Tracker

Track expenses, income & budgets with analytics, reminders, and cloud backup.

KharchuLu is a simple yet powerful personal finance and expense tracker designed to help you understand where your money goes. Add daily transactions in seconds, set budgets, track income & investments, view expense analytics, and keep your data synced securely in the cloud.

Manage money smarter — all in one clean and beautiful interface.

🔥 What You Can Do with KharchuLu

✔ Add & manage expenses, income, and investments
✔ View daily, monthly & yearly transaction history
✔ Smart analytics & pie-chart insights by category
✔ Budget alerts when spending crosses set limits
✔ Recurring transactions (daily / monthly / yearly)
✔ Calendar view for date-wise tracking
✔ Cloud backup & sync (Firebase)
✔ Works offline — syncs when you're online again
✔ Export data as CSV / PDF
✔ Simple, fast & distraction-free user experience

💡 More Features You’ll Love

🔹 Beautiful UI with category icons
🔹 Filter transactions by day, month, category, or custom range
🔹 Budget bar that turns red when over limit
🔹 Line graph trends to compare expense vs income
🔹 Restore data when switching or reinstalling device

📁 Backup & Sync

Your financial records are stored safely on Firebase cloud when you sign in, and also kept locally for offline usage. Even without internet — your app works smoothly.

